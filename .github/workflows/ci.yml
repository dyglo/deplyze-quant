name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Frontend ──────────────────────────────────────────────────────────────

  type-check-frontend:
    name: Type-check · Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

  build-frontend:
    name: Build · Frontend (Vite)
    runs-on: ubuntu-latest
    needs: type-check-frontend
    env:
      # Set these in GitHub → Settings → Secrets and variables → Actions.
      # CI falls back to placeholders so forks still validate the bundle output.
      VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-placeholder' }}
      VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'ci.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'ci-project' }}
      VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'ci-project.appspot.com' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
      VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:000000000000' }}
      VITE_FIREBASE_MEASUREMENT_ID:      ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-XXXXXXXXXX' }}
      VITE_GATEWAY_URL:                  ${{ secrets.VITE_GATEWAY_URL || 'https://gateway.example.com' }}
      VITE_DEV_GATEWAY_URL:              ${{ secrets.VITE_GATEWAY_URL || 'https://gateway.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          retention-days: 1

  # ─── Gateway ───────────────────────────────────────────────────────────────

  type-check-gateway:
    name: Type-check · Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-run/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloud-run/gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

  build-gateway:
    name: Build · Gateway (Docker)
    runs-on: ubuntu-latest
    needs: type-check-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation — no push)
        uses: docker/build-push-action@v5
        with:
          context: cloud-run/gateway
          push: false
          tags: deplyze-gateway:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Gate ──────────────────────────────────────────────────────────────────

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [type-check-frontend, build-frontend, type-check-gateway, build-gateway]
    steps:
      - run: echo "All CI checks passed ✓"
