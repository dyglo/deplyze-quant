name: Deploy

# ─── Trigger strategy ──────────────────────────────────────────────────────
# Deploys only on push to main (after PR merge) or manual workflow_dispatch.
# Each service job is gated on whether its source paths actually changed,
# so an unrelated frontend commit does not rebuild and redeploy the gateway.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_gateway:
        description: 'Skip gateway deployment (hosting only)'
        type: boolean
        default: false
      skip_hosting:
        description: 'Skip hosting deployment (gateway only)'
        type: boolean
        default: false
      skip_quant_engine:
        description: 'Skip quant engine deployment'
        type: boolean
        default: false
      skip_firestore:
        description: 'Skip Firestore rules + indexes deployment'
        type: boolean
        default: false

# ─── Concurrency ───────────────────────────────────────────────────────────
# Never cancel a live production deployment.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID:      deplyze-quant
  GCP_REGION:          us-central1
  CLOUD_RUN_SERVICE:   deplyze-gateway
  AR_REPOSITORY:       services
  AR_IMAGE:            deplyze-gateway
  FIREBASE_PROJECT_ID: deplyze-quant

jobs:
  # ─── 0. Path detection ─────────────────────────────────────────────────
  # Determines which service paths changed so downstream jobs can be skipped
  # when their source did not change. Manual workflow_dispatch always runs all
  # jobs unless the corresponding skip_* input is set.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      gateway:   ${{ steps.filter.outputs.gateway }}
      frontend:  ${{ steps.filter.outputs.frontend }}
      firestore: ${{ steps.filter.outputs.firestore }}
      quant:     ${{ steps.filter.outputs.quant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'cloud-run/gateway/**'
            frontend:
              - 'src/**'
              - 'index.html'
              - 'vite.config.*'
              - 'tsconfig*.json'
              - 'package*.json'
              - 'components.json'
            firestore:
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'firebase.json'
            quant:
              - 'services/quant-engine/**'

  # ─── 1. Deploy Cloud Run Gateway ───────────────────────────────────────
  deploy-gateway:
    name: Deploy · Gateway (Cloud Run)
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run when gateway source changed, or when manually triggered without skip.
    if: |
      (needs.detect-changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.skip_gateway != 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe ${{ env.AR_REPOSITORY }} \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet 2>/dev/null \
          || gcloud artifacts repositories create ${{ env.AR_REPOSITORY }} \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --description="Docker images for Deplyze Quant services" \
            --quiet
          echo "Artifact Registry repository: ${{ env.AR_REPOSITORY }} ✓"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: cloud-run/gateway
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.AR_IMAGE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.AR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.AR_IMAGE }}:${{ github.sha }}" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 60 \
            --set-env-vars "\
          FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }},\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }},\
          ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY }},\
          TWELVE_DATA_API_KEY=${{ secrets.TWELVE_DATA_API_KEY }},\
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }},\
          SERPER_API_KEY=${{ secrets.SERPER_API_KEY }},\
          POLYGON_API_KEY=${{ secrets.POLYGON_API_KEY }},\
          FMP_API_KEY=${{ secrets.FMP_API_KEY }},\
          EODHD_API_KEY=${{ secrets.EODHD_API_KEY }},\
          SEC_EDGAR_USER_AGENT=${{ secrets.SEC_EDGAR_USER_AGENT }}"

      - name: Verify gateway health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Gateway URL: $SERVICE_URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")
            echo "Attempt $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Gateway healthy ✓"; exit 0; fi
            sleep 5
          done
          echo "Gateway health check timed out" && exit 1

  # ─── 2. Deploy Firestore Rules & Indexes ───────────────────────────────
  deploy-firestore:
    name: Deploy · Firestore
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run when Firestore config changed, or when manually triggered without skip.
    if: |
      (needs.detect-changes.outputs.firestore == 'true' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.skip_firestore != 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore rules and indexes
        run: |
          firebase deploy --only firestore \
            --project ${{ env.FIREBASE_PROJECT_ID }} \
            --non-interactive

  # ─── 3. Build & Deploy Firebase Hosting ────────────────────────────────
  deploy-hosting:
    name: Deploy · Hosting (Firebase)
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-gateway]
    # Run when frontend source changed, or when manually triggered without skip.
    # Always condition ensures we check deploy-gateway outcome even when skipped.
    if: |
      always() &&
      (needs.deploy-gateway.result == 'success' || needs.deploy-gateway.result == 'skipped') &&
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.skip_hosting != 'true'
    permissions:
      contents: read
      id-token: write
    env:
      VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID:      ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_GATEWAY_URL:                  ${{ secrets.VITE_GATEWAY_URL }}
      VITE_DEV_GATEWAY_URL:              ${{ secrets.VITE_GATEWAY_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate build environment
        run: |
          MISSING=()
          [ -z "$VITE_FIREBASE_API_KEY" ]    && MISSING+=("VITE_FIREBASE_API_KEY")
          [ -z "$VITE_FIREBASE_PROJECT_ID" ] && MISSING+=("VITE_FIREBASE_PROJECT_ID")
          [ -z "$VITE_FIREBASE_APP_ID" ]     && MISSING+=("VITE_FIREBASE_APP_ID")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing mandatory build secrets: ${MISSING[*]}"
            exit 1
          fi
          echo "All mandatory build secrets are present ✓"

      - name: Build frontend
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting \
            --project ${{ env.FIREBASE_PROJECT_ID }} \
            --non-interactive

      - name: Live URL
        run: echo "Deployed to https://${{ env.FIREBASE_PROJECT_ID }}.web.app ✓"

  # ─── 4. Deploy Quant Engine (Python / Cloud Run) ───────────────────────
  deploy-quant-engine:
    name: Deploy · Quant Engine (Cloud Run)
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run when quant engine source changed, or when manually triggered without skip.
    if: |
      (needs.detect-changes.outputs.quant == 'true' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.skip_quant_engine != 'true'
    permissions:
      contents: read
      id-token: write

    env:
      QE_SERVICE:  deplyze-quant-engine
      QE_AR_REPO:  deplyze-quant-engine
      QE_AR_IMAGE: deplyze-quant-engine

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe ${{ env.QE_AR_REPO }} \
            --location=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --quiet 2>/dev/null \
          || gcloud artifacts repositories create ${{ env.QE_AR_REPO }} \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --description="Quant engine Docker images" --quiet

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push quant engine image
        uses: docker/build-push-action@v5
        with:
          context: services/quant-engine
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.QE_AR_REPO }}/${{ env.QE_AR_IMAGE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.QE_AR_REPO }}/${{ env.QE_AR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy quant engine to Cloud Run
        run: |
          gcloud run deploy ${{ env.QE_SERVICE }} \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.QE_AR_REPO }}/${{ env.QE_AR_IMAGE }}:${{ github.sha }}" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --set-env-vars "\
          GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},\
          BIGQUERY_LOCATION=US,\
          QUANT_ENGINE_ENV=production,\
          POLYGON_API_KEY=${{ secrets.POLYGON_API_KEY }},\
          FMP_API_KEY=${{ secrets.FMP_API_KEY }},\
          EODHD_API_KEY=${{ secrets.EODHD_API_KEY }},\
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }},\
          TWELVE_DATA_API_KEY=${{ secrets.TWELVE_DATA_API_KEY }},\
          ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY }},\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }},\
          SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}"

      - name: Verify quant engine health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.QE_SERVICE }} \
            --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "Quant Engine URL: $SERVICE_URL"
          TOKEN=$(gcloud auth print-identity-token)
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/health" || echo "000")
            echo "Attempt $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Quant Engine healthy ✓"; exit 0; fi
            sleep 5
          done
          echo "Quant Engine health check timed out" && exit 1
