name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_gateway:
        description: 'Skip gateway deployment (hosting only)'
        type: boolean
        default: false
      skip_hosting:
        description: 'Skip hosting deployment (gateway only)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a live deployment

env:
  GCP_PROJECT_ID:      deplyze-quant
  GCP_REGION:          us-central1
  CLOUD_RUN_SERVICE:   deplyze-gateway
  AR_REPOSITORY:       services
  AR_IMAGE:            deplyze-gateway
  FIREBASE_PROJECT_ID: deplyze-quant

jobs:
  # ─── 1. Deploy Cloud Run Gateway ─────────────────────────────────────────

  deploy-gateway:
    name: Deploy · Gateway (Cloud Run)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_gateway != 'true' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Authenticate with GCP.
      # Secret: GCP_SA_KEY — full JSON of a service account key with roles:
      #   roles/run.admin  ·  roles/iam.serviceAccountUser  ·  roles/artifactregistry.writer
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: cloud-run/gateway
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.AR_IMAGE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.AR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.AR_IMAGE }}:${{ github.sha }}" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 60 \
            --set-env-vars "\
          FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }},\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }},\
          ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY }},\
          TWELVE_DATA_API_KEY=${{ secrets.TWELVE_DATA_API_KEY }},\
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }},\
          SERPER_API_KEY=${{ secrets.SERPER_API_KEY }},\
          POLYGON_API_KEY=${{ secrets.POLYGON_API_KEY }},\
          FMP_API_KEY=${{ secrets.FMP_API_KEY }},\
          EODHD_API_KEY=${{ secrets.EODHD_API_KEY }},\
          SEC_EDGAR_USER_AGENT=${{ secrets.SEC_EDGAR_USER_AGENT }}"

      - name: Verify gateway health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Gateway URL: $SERVICE_URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")
            echo "Attempt $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Gateway healthy ✓"; exit 0; fi
            sleep 5
          done
          echo "Gateway health check failed after 60s" && exit 1

  # ─── 2. Deploy Firestore Rules & Indexes ─────────────────────────────────

  deploy-firestore:
    name: Deploy · Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore rules and indexes
        run: |
          firebase deploy --only firestore \
            --project ${{ env.FIREBASE_PROJECT_ID }} \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive

  # ─── 3. Build & Deploy Firebase Hosting ──────────────────────────────────

  deploy-hosting:
    name: Deploy · Hosting (Firebase)
    runs-on: ubuntu-latest
    needs: [deploy-gateway]
    if: |
      always() &&
      (needs.deploy-gateway.result == 'success' || needs.deploy-gateway.result == 'skipped') &&
      github.event.inputs.skip_hosting != 'true'
    env:
      VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID:      ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_GATEWAY_URL:                  ${{ secrets.VITE_GATEWAY_URL }}
      VITE_DEV_GATEWAY_URL:              ${{ secrets.VITE_GATEWAY_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting \
            --project ${{ env.FIREBASE_PROJECT_ID }} \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive

      - name: Print live URL
        run: echo "Live at https://${{ env.FIREBASE_PROJECT_ID }}.web.app"
