[package]
name = "deplyze-backtest-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Deplyze Quant — regime-conditioned backtesting engine (Rust execution core)"
license = "UNLICENSED"

[[bin]]
name = "deplyze-backtest-engine"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Numerics / linear algebra (full-covariance HMM)
nalgebra = "0.33"
statrs = "0.18"

# Parquet / Arrow (columnar warehouse reads)
arrow = "53"
parquet = "53"

# Object storage (GCS + local file fallback)
object_store = { version = "0.11", features = ["gcp"] }
bytes = "1"
futures = "0.3"

# Dates
chrono = { version = "0.4", features = ["serde"] }

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
approx = "0.5"
rand = "0.8"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
