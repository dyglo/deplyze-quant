<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
    <defs>
        <!-- 
          We use a mask to "carve out" the orange P-shapes from the solid black D.
          In an SVG mask: 
          - White (#FFFFFF) reveals the object.
          - Black (#000000) hides the object (creating the transparent/orange cutouts).
        -->
        <mask id="logo-mask">
            <!-- 1. Base Mask: Reveal the entire shape initially -->
            <rect width="1000" height="1000" fill="white" />

            <!-- 2. The Stem of the 'P': A clean vertical cut -->
            <rect x="370" y="330" width="70" height="430" fill="black" />

            <!-- 3. The Bowl of the 'P': A thick outline leaving a solid center island -->
            <path d="M 440 330
                     L 500 330
                     A 130 130 0 0 1 630 460
                     A 130 130 0 0 1 500 590
                     L 440 590
                     L 440 520
                     L 500 520
                     A 60 60 0 0 0 560 460
                     A 60 60 0 0 0 500 400
                     L 440 400
                     Z" fill="black" />

            <!-- 4. The Bottom-Left Swoop: Flows seamlessly from the inner bowl curve -->
            <path d="M 370 520
                     C 310 520, 280 590, 230 610
                     L 230 680
                     C 280 660, 330 590, 370 590
                     Z" fill="black" />

            <!-- 5. The Top-Right Slicing Accent: A sharp, elegant curve branching off the bowl -->
            <path d="M 555 340
                     C 590 310, 615 265, 640 230
                     L 650 245
                     C 625 280, 600 320, 565 355
                     Z" fill="black" />
        </mask>
    </defs>

    <!-- Base Terracotta Background matching the original image -->
    <rect width="1000" height="1000" fill="#BE5334" />

    <!-- 
      The Main 'D' Body 
      A solid geometric shape rendered in deep black. The mask defined above 
      is applied to dynamically cut out the 'P' and the sweeping lines.
    -->
    <path d="M 250 250
             L 500 250
             A 250 250 0 0 1 750 500
             A 250 250 0 0 1 500 750
             L 250 750
             Z" fill="#0A0A0A" mask="url(#logo-mask)" />
</svg>
